services:
  orthanc-a:
    # image: orthancteam/orthanc:26.6.0
    image: orthancteam/orthanc-pre-release:master-unstable
    ports: ["4252:4242", "8052:8042"]
    volumes: ["storage-a:/var/lib/orthanc/db/"]
    environment:
      VERBOSE_STARTUP: "true"
      VERBOSE_ENABLED: "true"
      ORTHANC_JSON: |
        {
          "Name": "Orthanc A",
          "DicomAet": "ORTHANCA",
          "AuthenticationEnabled": false,
          "DicomScuTimeout": 20,
          "DicomModalities": {
            "b-get" : {
                    "AET" : "ORTHANCB",
                    "Port" : 4242,
                    "Host" : "orthanc-b",
                    "RetrieveMethod": "C-GET"
                  },
            "b-move" : {
                    "AET" : "ORTHANCB",
                    "Port" : 4242,
                    "Host" : "orthanc-b",
                    "RetrieveMethod": "C-MOVE"
                  }
          }
        }
      # "IngestTranscoding": "1.2.840.10008.1.2.4.70"
      # "AcceptedSopClasses" : [
      #   "1.3.12.2.1107.5.9.1",  // allow one custom SOP Class
      #   "1.2.840.*"             // still allow default SOP Classes
      # ]

  orthanc-b:
    image: orthancteam/orthanc:26.4.2
    ports: ["4253:4242", "8053:8042"]
    volumes: ["storage-b:/var/lib/orthanc/db/"]
    environment:
      ORTHANC_JSON: |
        {
          "Name": "Orthanc B",
          "DicomAet": "ORTHANCB",
          "AuthenticationEnabled": false,
          "DicomModalities": {
            "a": ["ORTHANCA", "orthanc-a", 4242],
            "b": ["ORTHANCB", "orthanc-b", 4242],
            "c": ["ORTHANCC", "orthanc-c", 4242]
          }
        }
      # "AcceptedTransferSyntaxes": [
      #   "1.2.840.10008.1.2"
      # ],
      # "AcceptedSopClasses": [
      #   "1.2.840.10008.5.1.4.1.1.4",
      #   "1.2.840.10008.5.1.4.1.1.4.1"
      # ]
  orthanc-c:
    image: orthancteam/orthanc
    ports: ["4254:4242", "8054:8042"]
    volumes: ["storage-c:/var/lib/orthanc/db/"]
    environment:
      ORTHANC_JSON: |
        {
          "Name": "Orthanc C",
          "DicomAet": "ORTHANCC",
          "AuthenticationEnabled": false,
          "DicomModalities": {
            "a": ["ORTHANCA", "orthanc-a", 4242],
            "b": ["ORTHANCB", "orthanc-b", 4242],
            "c": ["ORTHANCC", "orthanc-c", 4242]
          }
        }

volumes:
  storage-a:
  storage-b:
  storage-c:
