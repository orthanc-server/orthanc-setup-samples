  orthanc-sqlite-ref:
    # image: ${ORTHANC_IMAGE}
    image: orthancteam/orthanc:26.9.1
    restart: unless-stopped
    ports: ["8143:8042"]
    volumes: 
      - orthanc-storage-sqlite-ref:/var/lib/orthanc/db
      - ./plugin.py:/scripts/plugin.py
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      TRACE_ENABLED: true
      ORTHANC_JSON: |
        {
          "Name": "SQLite Ref 1.13.0",
          "AuthenticationEnabled": false,
          "DicomWeb": {
            "EnableMetadataCache": false
          },
          "PythonScript": "/scripts/plugin.py",
          "StableAge": 1  // To trigger /metadata computation ASAP
        }

  orthanc-sqlite-next:
    # image: ${ORTHANC_IMAGE}
    image: orthancteam/orthanc-pre-release:master-normal-unstable-before-tests-amd64
    restart: unless-stopped
    ports: ["8144:8042"]
    volumes: 
      - orthanc-storage-sqlite-next:/var/lib/orthanc/db
      - ./plugin.py:/scripts/plugin.py
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC_JSON: |
        {
          "Name": "SQLite",
          "AuthenticationEnabled": false,
          "DicomWeb": {
            "EnableMetadataCache": false
          },
          "PythonScript": "/scripts/plugin.py",
          "StableAge": 1  // To trigger /metadata computation ASAP
        }



  orthanc-pg-ref:
    image: orthancteam/orthanc:26.9.1
    # image: ${ORTHANC_IMAGE}
    restart: unless-stopped
    ports: ["8145:8042"]
    volumes: 
      - orthanc-storage-pg-ref-files:/var/lib/orthanc/db
      - ./plugin.py:/scripts/plugin.py
      - ./db-snapshots:/db-snapshots
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC_JSON: |
        {
          "Name": "PG 1.12.10",
          "AuthenticationEnabled": false,
          "PythonScript": "/scripts/plugin.py",
          "StableAge": 1  // To trigger /metadata computation ASAP
          
          , "PostgreSQL": {
            "Host": "pg-ref-db"
          }
        }

  pg-ref-db:
    image: postgres:18
    restart: unless-stopped
    ports: ["6432:5432"]
    volumes: 
      - pg-ref-db:/var/lib/postgresql/18/docker
      - ./db-snapshots:/db-snapshots
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"


