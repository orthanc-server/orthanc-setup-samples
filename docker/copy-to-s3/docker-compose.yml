services:

    # this is the Orthanc acting as a Gateway between the PACS and S3
    orthanc-gw:
        build: orthanc-gw
        ports: [8042:8042]
        volumes:
            - orthanc-storage:/var/lib/orthanc/db
        environment:
            VERBOSE_ENABLED: "true"
            VERBOSE_STARTUP: "true"
            ORTHANC_JSON: |
                {
                    "Name": "Orthanc Gateway",
                    "DicomAET": "ORTHANCGW",
                    "DicomModalities": {
                        "pacs": ["PACS", "pacs", 4242]
                    },
                    "RegisteredUsers": {
                        "demo": "demo"
                    },
                    "StableAge": 3
                }
            # note: in a prod setup, the S3 access_key and secret_key should be passed as secrets
            AWS_ACCESS_KEY_ID: "s3-like-admin"
            AWS_SECRET_ACCESS_KEY: "change-me"
            S3_BUCKET: "test-bucket"
            # this is not required when using real AWS S3
            S3_ENDPOINT: "http://s3-like:8333"
            
            S3_PATH_TEMPLATE: "{StudyDate}/{PatientID}-{PatientName}.zip" 
            S3_DELETE_AFTER_EXPORT: "true"


    # this is simulating the S3 buckets
    s3-like:
        image: chrislusf/seaweedfs
        # don't expose these ports in a real world setup
        ports: [8333:8333, 8888:8888]
        environment:
            - AWS_ACCESS_KEY_ID=s3-like-admin
            - AWS_SECRET_ACCESS_KEY=change-me
            - S3_BUCKET=test-bucket
        volumes:
            - s3-like-storage:/data
        command: mini -dir=/data


    # this is an orthanc simulating the PACS or workstation
    pacs:
        image: orthancteam/orthanc
        ports: [8043:8042]
        volumes:
            - pacs-storage:/var/lib/orthanc/db
        environment:
            VERBOSE_ENABLED: "true"
            VERBOSE_STARTUP: "true"
            ORTHANC_JSON: |
                {
                    "Name": "PACS",
                    "DicomAET": "PACS",
                    "DicomModalities": {
                        "gw-to-s3": ["ORTHANCGW", "orthanc-gw", 4242]
                    },
                    "AuthenticationEnabled": false
                }


volumes:
    s3-like-storage:
    orthanc-storage:
    pacs-storage:

